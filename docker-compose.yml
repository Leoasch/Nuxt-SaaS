services:
    postgres:
        image: postgres:17
        restart: unless-stopped
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: Q7i{G8HU?71gKpv
            POSTGRES_DB: main
            TZ: "America/Sao_Paulo"
            PGTZ: "America/Sao_Paulo"
        ports:
            - "5432:5432"
        volumes:
            - ./postgres-data:/var/lib/postgresql/data

    minio:
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        restart: unless-stopped
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${NUXT_S3_ACCESS_KEY_ID}
            MINIO_ROOT_PASSWORD: ${NUXT_S3_SECRET_ACCESS_KEY}
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - ./minio-data:/data

volumes:
  postgres-data: