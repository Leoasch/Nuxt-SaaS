name: reset-demo

# Restores the public demo every night: deletes what the seeder created (only that) and seeds again,
# which also moves the simulated sales to the current dates.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency: reset-demo

jobs:
  reset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache product photos
        uses: actions/cache@v6
        with:
          path: .data/seed-cache
          key: seed-images-${{ hashFiles('server/seed/catalog.ts') }}

      - name: Reset the demo data
        run: pnpm seed --reset
        env:
          NUXT_DATABASE_HOST: ${{ secrets.NUXT_DATABASE_HOST }}
          NUXT_DATABASE_PORT: ${{ secrets.NUXT_DATABASE_PORT }}
          NUXT_DATABASE_NAME: ${{ secrets.NUXT_DATABASE_NAME }}
          NUXT_DATABASE_USER: ${{ secrets.NUXT_DATABASE_USER }}
          NUXT_DATABASE_PASSWORD: ${{ secrets.NUXT_DATABASE_PASSWORD }}
          NUXT_DATABASE_SSL: ${{ secrets.NUXT_DATABASE_SSL }}
          NUXT_S3_ENDPOINT: ${{ secrets.NUXT_S3_ENDPOINT }}
          NUXT_S3_REGION: ${{ secrets.NUXT_S3_REGION }}
          NUXT_S3_BUCKET: ${{ secrets.NUXT_S3_BUCKET }}
          NUXT_S3_ACCESS_KEY_ID: ${{ secrets.NUXT_S3_ACCESS_KEY_ID }}
          NUXT_S3_SECRET_ACCESS_KEY: ${{ secrets.NUXT_S3_SECRET_ACCESS_KEY }}
